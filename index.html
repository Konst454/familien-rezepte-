<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Creative Recipes</title>
  <meta name="description" content="Rezepte, Wochenplan und Einkaufsliste für die Familie">
  <meta name="theme-color" content="#FFF6EC">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rezepte">
  <!-- Darstellung sofort setzen (vor dem Stylesheet), damit nichts hell aufblitzt. Logik: js/theme.js -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cr-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#111214' : '#FFF6EC');
      } catch (e) {}
    })();
  </script>
  <style>
    html { background: #FFF6EC; color-scheme: light; }
    html[data-theme="dark"] { background: #111214; color-scheme: dark; }
    @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #111214; color-scheme: dark; } }
  </style>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><div class="loading">Creative Recipes</div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px">Bitte JavaScript aktivieren, um die Rezepte-App zu nutzen.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
